<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Loja Virtual</title>
<script>
async function comprar(produtoId, preco) {
    const btn = event.target;
    btn.disabled = true;
    btn.innerText = 'Processando...';

    try {
        const res = await fetch('/api/pedidos/processar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                idUsuario: 1, // Exemplo de usuário logado
                itens: [
                    { idProduto: produtoId, quantidade: 1, precoUnitario: preco }
                ]
            })
        });

        const resultado = await res.json();

        if (res.ok) {
            alert('✅ ' + resultado.mensagem);
            // Recarrega o catálogo para mostrar o novo saldo de estoque abatido
            carregarProdutos();
        } else {
            alert('❌ Erro: ' + resultado.erro);
        }
    } catch (err) {
        alert('Erro ao se comunicar com o servidor.');
    } finally {
        btn.disabled = false;
        btn.innerText = 'Comprar Agora';
    }
}
</script>
</body>
</html>
